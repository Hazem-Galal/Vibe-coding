<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vibe-coding — Welcome</title>
  <style>
    :root{--bg1:#0f172a;--bg2:#0ea5a4;--accent:#f97316;--glass:rgba(255,255,255,0.06)}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg1),#081229);color:#fff}
    .card{width:min(720px,92%);padding:48px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent);box-shadow:0 10px 30px rgba(2,6,23,0.6);backdrop-filter:blur(6px);text-align:center}
    h1{margin:0 0 12px;font-size:clamp(28px,4vw,40px);letter-spacing:-0.02em}
    p{margin:0 0 24px;color:#cbd5e1}
    .cta{appearance:none;border:0;padding:12px 22px;border-radius:10px;background:linear-gradient(90deg,var(--accent),#ef4444);color:#fff;font-weight:600;cursor:pointer;font-size:16px}
    .cta:active{transform:translateY(1px)}
    .sub{margin-top:18px;font-size:13px;color:#94a3b8}
    .logo{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--glass);margin-bottom:18px}
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="logo">🎧 Vibe-coding</div>
    <h1>Welcome to Vibe-coding</h1>
    <p>A tiny starter splash to get your project running. Click below to see how to run the Node script.</p>
    <button class="cta" id="cta">Get Started</button>
    <div class="sub">Or open <strong>splash.html</strong> directly in VS Code and preview it.</div>
  </div>

  <script>
    document.getElementById('cta').addEventListener('click', function(){
      const msg = 'To run the Node script, open a terminal in the project and run:\n\nnpm start\n\nOr open this file in a browser/VS Code Live Preview.';
      alert(msg);
    });
  </script>
</body>
</html>
